services:
  web:
    build: .
    ports:
      - "127.0.0.1:5001:5001"
    env_file: .env
    volumes:
      - security-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  mail:
    build: .
    command: ["python", "manage.py", "mail", "--watch"]
    env_file: .env
    volumes:
      - security-data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  security-data:
